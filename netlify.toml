# Netlify build settings for this Vite site.
# When the repository is connected in Netlify, these are picked up automatically.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs a current Node; 22 is Netlify's current default runtime
  NODE_VERSION = "22"

# the site is a single page: any unknown path falls back to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
